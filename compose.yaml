name: luce-business

services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-progettoluce_business}
      POSTGRES_USER: ${DB_USER:-luce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Imposta DB_PASSWORD nel file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-progettoluce_business}
      DB_USER: ${DB_USER:-luce}
      DB_PASSWORD: ${DB_PASSWORD}
      FONTI_AUTOMATICO: ${FONTI_AUTOMATICO:-true}
      GME_LOGIN: ${GME_LOGIN:-}
      GME_PASSWORD: ${GME_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${BUSINESS_PORT:-8089}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  pgdata:
