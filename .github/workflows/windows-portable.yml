name: Pacchetto Windows portabile
on:
  push:
    branches: [windows-portabile, simulatore-business]
  pull_request:
    branches: [integrazioneAPI, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FONTI_AUTOMATICO: "false"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.20+8"
          architecture: x64
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test e compilazione frontend
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci fallito' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Test frontend falliti' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build frontend fallita' }
      - name: Integra interfaccia nel JAR, test e compilazione backend
        run: |
          New-Item -ItemType Directory -Force backend/src/main/resources/static | Out-Null
          Copy-Item -Recurse frontend/dist/* backend/src/main/resources/static/
          mvn -B -f backend/pom.xml verify
          if ($LASTEXITCODE -ne 0) { throw 'Verifica backend fallita' }
      - name: Crea pacchetto con runtime Java incluso
        run: ./scripts/package-windows.ps1
      - name: Estrai ZIP in un percorso con spazi e caratteri accentati
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'Prova Windows caffè'
          Expand-Archive dist-windows/ProgettoLuce-Windows-x64.zip $testRoot
          "LUCE_WINDOWS_PACKAGE=$testRoot\ProgettoLuce-Windows-x64" >> $env:GITHUB_ENV
      - name: Verifica launcher, porta occupata, API, PDF e persistenza
        run: ./scripts/test-windows.ps1 -Package $env:LUCE_WINDOWS_PACKAGE
      - name: Installa browser di test
        working-directory: frontend
        run: npx playwright install chromium
      - name: Verifica interfaccia reale del pacchetto Windows
        env:
          LUCE_E2E_URL: http://127.0.0.1:8088
        run: |
          # Nuova cartella per i test browser: il pacchetto consegnato rimane vuoto.
          $browserRoot = Join-Path $env:RUNNER_TEMP 'Browser Windows'
          Expand-Archive dist-windows/ProgettoLuce-Windows-x64.zip $browserRoot
          $launcher = Join-Path $browserRoot 'ProgettoLuce-Windows-x64/Launcher.ps1'
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw 'Avvio per test browser fallito' }
            Push-Location frontend
            try {
              npm run test:e2e
              if ($LASTEXITCODE -ne 0) { throw 'Test browser Windows falliti' }
            } finally { Pop-Location }
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -Action Stop -NoBrowser
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ProgettoLuce-Business-Windows-x64
          path: |
            dist-windows/ProgettoLuce-Windows-x64.zip
            dist-windows/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: |
            frontend/test-results/
            ${{ env.LUCE_WINDOWS_PACKAGE }}/logs/
