name: Verifica ProgettoLuce
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: luce-ci-${{ github.run_id }}
      DB_NAME: luce_compose_ci
      DB_USER: luce
      DB_PASSWORD: synthetic-compose-test-password
      BUSINESS_PORT: '8089'
      BUSINESS_TEST_URL: http://127.0.0.1:8089
      FONTI_AUTOMATICO: 'false'
      BUSINESS_ADMIN_TOKEN: synthetic-business-ci-key
    steps:
      - uses: actions/checkout@v4
      - name: Build immagini e avvio dello stack
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
      - name: Simulazione business sulla porta 8089
        run: |
          python3 scripts/carica-esempio.py http://127.0.0.1:8089/api
          python3 scripts/verifica-compose.py crea "$RUNNER_TEMP/confronto-compose.json"
      - name: Ricrea i container e verifica la persistenza del volume
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 180
          python3 scripts/verifica-compose.py verifica "$RUNNER_TEMP/confronto-compose.json"
      - name: Log dello stack
        if: always()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Rimuovi soltanto lo stack temporaneo della CI
        if: always()
        run: docker compose down --volumes --remove-orphans
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_DB: luce_test
          POSTGRES_USER: luce
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U luce -d luce_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test H2, Flyway e package
        working-directory: backend
        run: mvn -B verify
      - name: Test su PostgreSQL reale
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/luce_test
          SPRING_DATASOURCE_USERNAME: luce
          SPRING_DATASOURCE_PASSWORD: test-only-password
        run: mvn -B test
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/progetto-luce-0.1.0.jar
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results/
