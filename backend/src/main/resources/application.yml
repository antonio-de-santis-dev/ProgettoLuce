spring:
  application:
    name: progetto-luce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/progettoluce}
    username: ${DB_USER:luce}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fonti:
  automatico: ${FONTI_AUTOMATICO:true}
  intervallo-ms: ${FONTI_INTERVALLO_MS:86400000}
  gme:
    login: ${GME_LOGIN:}
    password: ${GME_PASSWORD:}

business:
  admin-token: ${BUSINESS_ADMIN_TOKEN:}
