spring:
  datasource:
    url: jdbc:h2:file:./data/luce;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
server:
  address: 127.0.0.1
  port: 8088
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
luce.portable:
  token: ${LUCE_PORTABLE_TOKEN}
  instance: ${LUCE_PORTABLE_INSTANCE}
